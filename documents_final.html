<!DOCTYPE html><html lang="si"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SFG - Quotation & Invoice Sheets</title><style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f6f9;margin:0;padding:24px;color:#222;user-select:none;-webkit-user-select:none;-moz-user-select:none}.wrap{max-width:1200px;margin:auto;background:#fff;border:1px solid #d5dbe3;border-radius:12px;box-shadow:0 5px 20px rgba(0,0,0,.1);padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #004085;padding-bottom:12px;margin-bottom:15px}.head h2{margin:0;color:#004085}.btn{background:#004085;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:bold;cursor:pointer}.tools{display:flex;gap:10px;margin-bottom:12px}.tools input{flex:1;padding:9px;border:1px solid #aaa;border-radius:5px}table{width:100%;border-collapse:collapse}th{background:#004085;color:#fff;padding:10px;text-align:left}td{padding:10px;border-bottom:1px solid #ddd}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f9fd}.pending{color:#dc3545;font-weight:800}.complete{color:#198754;font-weight:800}.empty{text-align:center;padding:30px;color:#777}@media(max-width:700px){body{padding:8px}.wrap{padding:10px;overflow:auto}table{min-width:760px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body oncontextmenu="return false" ondragstart="return false"><div class="wrap"><div class="head"><h2>Quotation & Invoice Sheets</h2><button class="btn" onclick="window.close()">Close</button></div><div class="tools"><input id="search" placeholder="Search Date, Subject, Job No or Document No..." oninput="render()"><button class="btn" onclick="loadAndRender()">Refresh</button></div><table><thead><tr><th>Date</th><th>Subject</th><th>Job No (RD No)</th><th>Quotation / Invoice No</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw14bM6eMeLGTZHqVurS-KuNJceCjj-BZujvAbHqzEG7Ic5i3SJetSuEJv7anw5rRodzg/exec";
function safe(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){if(!v)return '';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:safe(v)}
function localDocs(){let d={};try{d=JSON.parse(localStorage.getItem('sfg_all_drafts')||'{}')}catch(e){}return Object.values(d)}
async function remoteDocs(){try{const r=await fetch(SCRIPT_URL+'?action=list',{cache:'no-store'});if(!r.ok)return [];const x=await r.json();return Array.isArray(x)?x:(x.drafts||x.data||x.records||x.items||[])}catch(e){return []}}
async function loadAndRender(){const remote=await remoteDocs();let all=localDocs();remote.forEach(x=>{const d=x.data&&typeof x.data==='object'?x.data:x;const i=all.findIndex(y=>(y.rdno||'')===(d.rdno||'')&&(y.qno||'')===(d.qno||''));if(i>=0)all[i]=d;else all.push(d)});window.__docs=all;render()}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const map=new Map();(window.__docs||localDocs()).filter(d=>d.rdno||d.qno).forEach(d=>{const k=(d.rdno||'')+'_'+(d.qno||'');if(!map.has(k)||new Date(d.savedAt||0)>new Date(map.get(k).savedAt||0))map.set(k,d)});const docs=[...map.values()].filter(d=>[d.date,d.subject,d.rdno,d.qno].join(' ').toLowerCase().includes(q)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));const body=document.getElementById('rows');body.innerHTML='';if(!docs.length){body.innerHTML='<tr><td colspan="5" class="empty">No quotation / invoice sheets found.</td></tr>';return}docs.forEach(d=>{const tr=document.createElement('tr');const complete=String(d.cdate||'').trim()!=='';tr.innerHTML='<td>'+fmt(d.date)+'</td><td>'+safe(String(d.subject||'').substring(0,30))+'</td><td>'+safe(d.rdno)+'</td><td>'+safe(d.qno)+'</td><td class="'+(complete?'complete':'pending')+'">'+(complete?'Complete':'Pending')+'</td>';tr.onclick=()=>openSheet(d);body.appendChild(tr)})}
function openSheet(d){const key=(d.rdno&&d.qno)?'RD_'+d.rdno+'_NO_'+d.qno:'';if(!key)return;localStorage.setItem('sfg_current_draft_key',key);window.open('index.html?view=sheet&key='+encodeURIComponent(key),'_blank')}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['a','c','x','s','u','p'].includes(e.key.toLowerCase()))e.preventDefault();});loadAndRender();setInterval(loadAndRender,10000);
</script></body></html>
