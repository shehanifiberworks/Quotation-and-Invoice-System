<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SFG - Quotation & Invoice Sheets</title>
<style>
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f4f4f4;margin:0;padding:24px;color:#222} .wrap{max-width:1200px;margin:auto;background:#fff;border:1px solid #ccc;border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:20px}.head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px solid #004085;padding-bottom:12px;margin-bottom:15px}.head h2{margin:0;color:#004085}.btn{background:#004085;color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:bold;cursor:pointer}.tools{display:flex;gap:10px;margin-bottom:12px}.tools input{flex:1;padding:9px;border:1px solid #aaa;border-radius:5px}table{width:100%;border-collapse:collapse}th{background:#004085;color:#fff;padding:10px;text-align:left}td{padding:9px;border-bottom:1px solid #ddd}.file-row{cursor:pointer}.file-row:hover{background:#f5f9fd}.status-pending{color:#dc3545;font-weight:bold}.status-complete{color:#198754;font-weight:bold}.amount{font-weight:bold;text-align:right;white-space:nowrap}.empty{text-align:center;padding:30px;color:#777}@media(max-width:700px){body{padding:8px}.wrap{padding:10px;overflow:auto}table{min-width:900px}.head{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<div class="head"><h2>Quotation & Invoice Sheets</h2><button class="btn" onclick="window.close()">Close</button></div>
<div class="tools"><input id="search" placeholder="Search Date, Subject, Job No or Document No..." oninput="render()"><button class="btn" onclick="loadDocs()">Refresh</button></div>
<table><thead><tr><th>Date</th><th>Subject</th><th>Job No (RD No)</th><th>Quotation / Invoice No</th><th>TOTAL AMOUNT</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw14bM6eMeLGTZHqVurS-KuNJceCjj-BZujvAbHqzEG7Ic5i3SJetSuEJv7anw5rRodzg/exec";
let docs=[];
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmt(v){if(!v)return '';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:safe(v)}
function total(d){let sub=0;(d.items||[]).forEach(i=>sub+=(parseFloat(i.qty)||0)*(parseFloat(i.price)||0));const tax= d.fields?.['chk-show-tax']?.checked ? (parseFloat(d.tax)||0):0;const adv=String(d.docType||'').toUpperCase()==='INVOICE'?(parseFloat(d.fields?.['inv-advance-amount']?.value)||0):0;return sub+tax-adv}
function getKey(d){return d.key||((d.rdno||'')+'_'+(d.qno||''))}
async function loadDocs(){
  let local={};try{local=JSON.parse(localStorage.getItem('sfg_all_drafts')||'{}')}catch(e){}
  const map=new Map();Object.keys(local).forEach(k=>{const d=local[k]||{};if(d.rdno||d.qno)map.set(getKey({...d,key:k}),{...d,key:k})});
  try{const r=await fetch(SCRIPT_URL+'?action=list',{cache:'no-store'});if(r.ok){const raw=await r.json();const list=Array.isArray(raw)?raw:(raw.drafts||raw.data||raw.records||raw.items||[]);list.forEach((item,i)=>{const d=item.data&&typeof item.data==='object'?item.data:item;if(d&&(d.rdno||d.qno)){const key=item.key||getKey(d)||('remote_'+i);const old=map.get(key);if(!old||new Date(d.savedAt||0)>new Date(old.savedAt||0))map.set(key,{...d,key})}})}}catch(e){}
  docs=[...map.values()].filter(d=>d.rdno||d.qno).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  try{const merged={...local};docs.forEach(d=>{if(d.key)merged[d.key]=d});localStorage.setItem('sfg_all_drafts',JSON.stringify(merged))}catch(e){}
  render();
}
function render(){const q=(document.getElementById('search').value||'').toLowerCase();const body=document.getElementById('rows');body.innerHTML='';const list=docs.filter(d=>[d.date,d.subject,d.rdno,d.qno].join(' ').toLowerCase().includes(q));if(!list.length){body.innerHTML='<tr><td colspan="6" class="empty">No quotation / invoice sheets found.</td></tr>';return}list.forEach(d=>{const tr=document.createElement('tr');tr.className='file-row';const complete=String(d.cdate||'').trim()!=='';const amount=total(d).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});tr.innerHTML='<td>'+fmt(d.date)+'</td><td>'+safe(String(d.subject||'').substring(0,30))+'</td><td>'+safe(d.rdno)+'</td><td>'+safe(d.qno)+'</td><td class="amount">LKR '+amount+'</td><td class="'+(complete?'status-complete':'status-pending')+'">'+(complete?'Complete':'Pending')+'</td>';tr.onclick=()=>openSheet(d);body.appendChild(tr)})}
function openSheet(d){const key=d.key||getKey(d);window.open('index.html?view=sheet&key='+encodeURIComponent(key),'_blank');}
loadDocs();setInterval(loadDocs,5000);
</script>
</body></html>
